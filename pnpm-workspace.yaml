packages:
  - apps/*
  - apps/test-matrix/*
  - packages/*
onlyBuiltDependencies:
  - canvas
ignoredBuiltDependencies:
  - core-js
  - core-js-pure
  - esbuild
# react-resizable-panels has no @types/react peer, so it would get the React 18 types other packages hoist.
packageExtensions:
  react-resizable-panels:
    peerDependencies:
      "@types/react": "*"
# @pixi/layout 1.0 imports @pixi/mesh-extras and @pixi/sprite-tiling without declaring them.
  "@pixi/layout@1":
    dependencies:
      "@pixi/mesh-extras": ^7.3.1
      "@pixi/sprite-tiling": ^7.3.1
# pixi-viewport 5.0 imports @pixi/core and @pixi/display without declaring them, so it would get the hoisted PixiJS 6 copies.
  pixi-viewport@5:
    peerDependencies:
      "@pixi/core": ^7
      "@pixi/display": ^7
