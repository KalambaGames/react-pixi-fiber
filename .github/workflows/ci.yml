name: CI

on:
  pull_request:
  push:
    branches: [master, develop]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # pnpm version comes from the packageManager field in package.json
      - run: corepack enable

      # Download and cache dependencies
      - id: pnpm-store
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ hashFiles('.nvmrc', 'pnpm-lock.yaml') }}
          # fallback to using the latest cache if no exact match is found
          restore-keys: pnpm-store-

      - run: pnpm install --frozen-lockfile

      # check formatting and lint
      - run: pnpm lint

      # run build
      - run: pnpm build

      # check the packed packages with publint and attw, and which files Node and esbuild resolve
      - run: pnpm check-package

      # bundle the entries of each package that has a bundle check and check which modules each bundle holds
      - run: pnpm check-bundle

      # run tests
      - run: pnpm -r --workspace-concurrency=1 test:dev
      - run: pnpm -r --workspace-concurrency=1 test:prod

      # render once from the ES builds. The production builds bundle the production reconciler, which the development
      # React of the test environment cannot drive, so only the development builds render here.
      - run: RPF_DIST=es pnpm --filter "test-matrix-*" --workspace-concurrency=1 test:dev

      # typecheck the library source, the TypeScript fixture, and the playgrounds against the built declarations
      - run: pnpm check-types
