version: 2
updates:
  # Run at the workspace root, so that each update also changes pnpm-lock.yaml.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Security updates only.
    open-pull-requests-limit: 0
    commit-message:
      prefix: build
    # A major bump needs code changes, so a person makes it.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
